name: Desplegar Tutorías en Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          run_install: false

      - name: Configurar Node.js y caché de pnpm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Compilar presentaciones
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Publicar en Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
